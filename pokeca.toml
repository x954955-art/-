# ダブルクリックで使うとき（pokeca_search.bat / pokeca_watch.bat）の検索条件です。
# メモ帳で開いて書き換え、上書き保存すると次から反映されます。
#
#   keyword    : 探す範囲（scan = true のとき）か、狙うカードの名前・レアリティ・番号
#   min_price  : 仕入れ値の下限（円）  max_price : 仕入れ値の上限（円）
#   min_profit : これ以上の利益（手数料10%と送料を引いたあと）が出るものだけ表示（円）
#   min_roi    : 利益率（利益 ÷ 仕入れ値）の下限
#   min_sales  : 直近30日にこれ以上売れているカードだけ表示

[defaults]
profile = "pokeca"
# 探すサイト（mercari=メルカリ / rakuma=ラクマ / yahoo=Yahoo!フリマ / snkrdunk=スニダン）
# 相場（売り切れ価格）はメルカリとラクマから調べ、Yahoo!フリマとスニダンは「買う候補」だけを集める
# 使わないサイトは、そのサイトの名前を消す（例: sources = ["mercari", "yahoo"]）
sources = ["mercari", "rakuma", "yahoo", "snkrdunk"]
min_profit = 1000
min_roi = "15%"
min_sales = 3

[[search]]
keyword = "ポケモンカード SAR"
scan = true
min_price = 2000
max_price = 50000

# 旧裏（1996〜2001年ごろの古いカード）。カード番号がないので、カード名（リザードンなど）ごとに相場を調べる
# 相場を知らない人は「旧裏」と書かずに「昔の」「当時物」と書くことが多いので、その言葉でもまとめて探す
#   → 「旧裏」と書かれていない出品には「写真で確認」の印が付く。写真で古いカードか必ず確かめてから買う
#   → 探す言葉を足すときは、["…", "…"] の中に「, "ポケモンカード 古い"」のように書き足す
# 古いカードは売れるペースがゆっくりなので、直近30日に1件以上売れていれば候補にする（min_sales = 1）
# 旧裏を探さないときは、下の7行の先頭に「# 」を付けて上書き保存する
[[search]]
keyword = ["ポケモンカード 旧裏", "ポケモンカード 昔", "ポケモンカード 当時物"]
scan = true
scan_cards = 25
min_price = 2000
max_price = 50000
min_sales = 1

# ほかのレアリティも探すときは、下の5行の先頭の「# 」を消して上書き保存する
# [[search]]
# keyword = "ポケモンカード SR"
# scan = true
# min_price = 2000
# max_price = 50000

# SM（2016〜2019年）のころのSR（GX）を探す例（先頭の「# 」を消す）
# [[search]]
# keyword = "ポケモンカード SR GX"
# scan = true
# min_price = 2000
# max_price = 50000

# 特定のカードを見張るときの例（先頭の「# 」を消す）
# [[search]]
# keyword = "リザードンex SAR 201/165"
