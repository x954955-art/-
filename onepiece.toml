# ダブルクリックで使うとき（onepiece_search.bat / onepiece_watch.bat）の、ワンピースカードの検索条件です。
# メモ帳で開いて書き換え、上書き保存すると次から反映されます。
#
#   keyword    : 探す範囲（scan = true のとき）か、狙うカードの名前・種類・カード番号
#                ["…", "…"] のように複数書くと、まとめて探して相場はカードごとに1回だけ調べる
#   min_price  : 仕入れ値の下限（円）  max_price : 仕入れ値の上限（円）
#   min_profit : これ以上の利益（手数料10%と送料を引いたあと）が出るものだけ表示（円）
#   min_roi    : 利益率（利益 ÷ 仕入れ値）の下限
#   min_sales  : 直近30日にこれ以上売れているカードだけ表示

[defaults]
profile = "onepiece"
# 探すサイト（mercari=メルカリ / rakuma=ラクマ / yahoo=Yahoo!フリマ / snkrdunk=スニダン）
# 相場（売り切れ価格）はメルカリとラクマから調べ、Yahoo!フリマとスニダンは「買う候補」だけを集める
# 使わないサイトは、そのサイトの名前を消す（例: sources = ["mercari", "yahoo"]）
sources = ["mercari", "rakuma", "yahoo", "snkrdunk"]
min_profit = 1000
min_roi = "15%"
min_sales = 3

# パラレル・SEC・SP をまとめて探す。カード番号（OP01-120 など）と種類（通常・パラレル・コミパラ・SP）ごとに相場を調べる
[[search]]
keyword = ["ワンピースカード パラレル", "ワンピースカード SEC", "ワンピースカード SP"]
scan = true
scan_cards = 25
min_price = 2000
max_price = 50000

# コミパラ（スーパーパラレル）は高いので、予算を上げて探す例（先頭の「# 」を消して上書き保存する）
# [[search]]
# keyword = "ワンピースカード コミパラ"
# scan = true
# min_price = 10000
# max_price = 300000

# 特定のカードを見張るときの例（先頭の「# 」を消す）。パラレルかどうかも書く
# [[search]]
# keyword = "シャンクス SEC パラレル OP01-120"

# BOX を見張るときの例（先頭の「# 」を消す）
# [[search]]
# keyword = "ワンピースカード 新時代の主役 BOX テープ付き"
