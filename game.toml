# ダブルクリックで使うとき（game_search.bat / game_watch.bat）の、ゲーム機・ソフトの検索条件です。
# メモ帳で開いて書き換え、上書き保存すると次から反映されます。
#
#   keyword    : 探すもの。本体は「本体」かモデル名（有機EL・Lite など）を入れ、ソフトはタイトルを入れる
#                ["…", "…"] のように複数書くと、ソフトはそれぞれ検索し、本体のスキャン（scan = true）はまとめて探す
#   min_price  : 仕入れ値の下限（円）  max_price : 仕入れ値の上限（円）
#   min_profit : これ以上の利益（手数料10%と送料を引いたあと）が出るものだけ表示（円）
#   min_roi    : 利益率（利益 ÷ 仕入れ値）の下限
#   min_sales  : 直近30日にこれ以上売れているものだけ表示

[defaults]
profile = "game"
# 探すサイト（mercari=メルカリ / rakuma=ラクマ / yahoo=Yahoo!フリマ）。スニダンはゲームをほとんど扱っていないので外している
sources = ["mercari", "rakuma", "yahoo"]
min_profit = 1000
min_roi = "15%"
min_sales = 3
# 探すものが多いので、1つあたりの取得を少なめにして早く終わるようにしている
pages = 1
sold_pages = 1
details = 5

# --- ゲーム機本体 ---------------------------------------------------------------------------
# モデル（Switch 2・有機EL・Lite・新型・旧型、PS5 の新型/初期型・ディスク版/デジタル版・Pro）ごとに相場を調べる。
# 「Nintendo Switch 本体」としか書かれておらずモデルが分からない出品は比べられないので外す
[[search]]
keyword = ["Nintendo Switch 本体", "PS5 本体"]
scan = true
scan_cards = 12
min_price = 8000
max_price = 100000

# --- 人気ソフト -----------------------------------------------------------------------------
# 新品未開封・中古・箱やケースなし・ジャンクを分けて相場を調べる。ソフトを足すときは [ ] の中に "タイトル", を書き足す
[[search]]
keyword = [
  "マリオカート8 デラックス",
  "大乱闘スマッシュブラザーズ SPECIAL",
  "あつまれ どうぶつの森",
  "スプラトゥーン3",
  "ゼルダの伝説 ティアーズ オブ ザ キングダム",
  "マリオカート ワールド",
  "ドンキーコング バナンザ",
  "モンスターハンターワイルズ",
]
min_price = 1500

# --- レトロゲーム（先頭の「# 」を消すと使える）------------------------------------------------
# 古いゲームは値上がりしやすい。箱説付きか、ソフトのみかで相場を分ける
# [[search]]
# keyword = "ゲームボーイ ポケットモンスター 赤"
# min_sales = 1
