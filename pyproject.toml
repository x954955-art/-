[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "furima-finder"
version = "0.3.1"
description = "メルカリ・ラクマの出品から、売り切れ価格（相場）より安い「買い」候補を探すツール"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "cryptography>=41",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
furima-finder = "furima_finder.cli:main"

[tool.setuptools.packages.find]
include = ["furima_finder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
