# ダブルクリックで使うとき（yugioh_search.bat / yugioh_watch.bat）の、遊戯王の検索条件です。
# メモ帳で開いて書き換え、上書き保存すると次から反映されます。
#
#   keyword    : 探す範囲（scan = true のとき）か、狙うカードの名前・レアリティ・カード番号
#                ["…", "…"] のように複数書くと、まとめて探して相場はカードごとに1回だけ調べる
#   min_price  : 仕入れ値の下限（円）  max_price : 仕入れ値の上限（円）
#   min_profit : これ以上の利益（手数料10%と送料を引いたあと）が出るものだけ表示（円）
#   min_roi    : 利益率（利益 ÷ 仕入れ値）の下限
#   min_sales  : 直近30日にこれ以上売れているカードだけ表示

[defaults]
profile = "yugioh"
# 探すサイト（mercari=メルカリ / rakuma=ラクマ / yahoo=Yahoo!フリマ / snkrdunk=スニダン）
# 相場（売り切れ価格）はメルカリとラクマから調べ、Yahoo!フリマとスニダンは「買う候補」だけを集める
# 使わないサイトは、そのサイトの名前を消す（例: sources = ["mercari", "yahoo"]）
sources = ["mercari", "rakuma", "yahoo", "snkrdunk"]
min_profit = 1000
min_roi = "15%"
min_sales = 3

# プリシク・クォーターセンチュリー（25thシク）・レリーフをまとめて探す。
# カード番号（QCCU-JP001 など）とレアリティごとに相場を調べる（同じカードでもレアリティが違えば別の相場）
[[search]]
keyword = ["遊戯王 プリシク", "遊戯王 クォーターセンチュリー", "遊戯王 レリーフ"]
scan = true
scan_cards = 25
min_price = 2000
max_price = 50000

# 20thシク・シークレットも探す例（先頭の「# 」を消して上書き保存する）
# [[search]]
# keyword = ["遊戯王 20thシク", "遊戯王 シークレット"]
# scan = true
# min_price = 2000
# max_price = 50000

# 特定のカードを見張るときの例（先頭の「# 」を消す）。レアリティも書き、カード番号も分かれば足すと正確になる
# [[search]]
# keyword = "灰流うらら プリシク"

# 初期など番号のない古いカードは、スキャンでは探せないので名前で見張る例
# [[search]]
# keyword = "青眼の白龍 初期 ウルトラ"
# min_sales = 1
